# Menjalankan StokLens lengkap di localhost dengan satu perintah:
#
#   docker compose up --build
#   → buka http://localhost:8000
#
# Rulebook AIC mewajibkan aplikasi bisa dijalankan lokal lewat docker compose.
# Tidak ada service database terpisah — StokLens memakai SQLite satu file,
# keputusan sadar untuk toko kecil (lihat docs/CATATAN-TIM.md).
services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # DB SQLite + crop hasil scan. Tanpa mount ini, seluruh data opname
      # hilang setiap `docker compose down`.
      - ./data:/app/data
      # Bobot model (CLIP ±600 MB, EasyOCR ±60–100 MB) di-download saat pertama
      # dipakai. Volume ini membuatnya cukup sekali, bukan tiap container dibuat
      # ulang. CLIP memang menulis ke ~/.cache; EasyOCR TIDAK — makanya
      # EASYOCR_MODULE_PATH diarahkan ke sini lewat Dockerfile.
      # `yolo11n.pt` (±5,5 MB) sengaja tidak dicakup, lihat catatan di Dockerfile.
      - model-cache:/root/.cache
    environment:
      STOKLENS_DB: /app/data/stoklens.db
      # Tanpa ini waktu lokal di dalam container = UTC, sehingga tanggal opname
      # antara 00:00-07:00 WIB tampil bertanggal hari sebelumnya. Aplikasi
      # menulis stempel waktu lokal (db._sekarang), jadi zona waktunya harus
      # benar. Ubah kalau tim/toko ada di WITA (Asia/Makassar) atau WIT
      # (Asia/Jayapura).
      TZ: Asia/Jakarta
    restart: unless-stopped

volumes:
  model-cache:
